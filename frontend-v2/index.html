<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- PWA: 让 iOS 当作 Web App 处理 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="砚台" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#fcfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>砚台 · 在线小说阅读</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("mojuan.prefs.v2");
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && parsed.state && parsed.state.theme ? parsed.state.theme : "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = theme === "system" ? (prefersDark ? "dark" : "paper") : theme;
          document.documentElement.dataset.paper = resolved;
          if (resolved === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
